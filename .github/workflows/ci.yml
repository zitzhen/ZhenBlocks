name: CI

# 每次 push（任意分支）或 pull_request 都运行构建校验
on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支上的新提交会取消仍在运行的旧 CI，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本模组编译目标为 Java 25，必须用完整 JDK（含 javac）
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 缓存 Gradle 发行版与依赖，加速后续构建
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # build 包含 compileJava / compileClientJava / jar / test / check
      - name: Build and check
        run: ./gradlew build --no-configuration-cache
